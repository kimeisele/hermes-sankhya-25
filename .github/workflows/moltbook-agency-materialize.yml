name: Moltbook Agency — Materialize

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Observe workflow run ID (numeric)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate run ID
        env:
          RUN_ID: "${{ inputs.artifact_run_id }}"
        run: |
          echo "$RUN_ID" | grep -qE '^[0-9]+$' || {
            echo "Error: artifact_run_id must be numeric"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          name: hq-report-observe-${{ inputs.artifact_run_id }}
          path: /tmp/artifact
        continue-on-error: true

      - name: Validate and materialize
        env:
          RUN_ID: "${{ inputs.artifact_run_id }}"
        run: |
          if [ ! -f /tmp/artifact/ctx_artifact.json ]; then
            echo "Error: artifact not found for run $RUN_ID"
            exit 1
          fi
          python -c "
          import json
          ctx = json.load(open('/tmp/artifact/ctx_artifact.json'))
          print('CTX run_id:', ctx.get('run_id'))
          print('CTX status:', ctx.get('status'))
          "

          SAFE_BRANCH="materialize/agency-run-${RUN_ID}"
          git checkout -b "$SAFE_BRANCH"
          mkdir -p "data/agency/runs"
          cp /tmp/artifact/ctx_artifact.json "data/agency/runs/run-${RUN_ID}.json"
          cp /tmp/artifact/hq_report.md "data/agency/runs/run-${RUN_ID}.md"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/agency/runs/run-${RUN_ID}.json" "data/agency/runs/run-${RUN_ID}.md"
          git commit -m "materialize: agency run ${RUN_ID}"
          git push origin "$SAFE_BRANCH"

      - uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.RUN_ID;
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Materialize agency run ${runId}`,
              head: `materialize/agency-run-${runId}`,
              base: 'main',
              body: `Materialized from observe run ${runId}.\n\nReview and merge to persist.`,
              draft: true
            });
            console.log(`PR: ${pr.html_url}`);
