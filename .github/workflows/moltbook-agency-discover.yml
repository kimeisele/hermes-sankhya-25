name: Moltbook Agency — Global Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: moltbook-agency-discover
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run global discovery
        id: discover
        run: |
          python3 scripts/moltbook_discover.py \
            --output /tmp/discovery \
            --report /tmp/discovery/discovery_report.md \
            --candidates /tmp/discovery/discovery_candidates.json
        env:
          MOLTBOOK_API_URL: https://www.moltbook.com/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: |
            /tmp/discovery/discovery_candidates.json
            /tmp/discovery/discovery_report.md
          retention-days: 7

      - name: Report candidates or failures to HQ issue
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let candidateCount = 0;
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/discovery/discovery_candidates.json', 'utf8'));
              candidateCount = data.candidate_count || 0;
              body = `## Global Discovery — ${new Date().toISOString()}\n\n` +
                `Candidates: ${candidateCount}\n\n` +
                data.candidates.map(c =>
                  `- [${c.title}](${c.canonical_url}) — ${c.author_handle} (score ${c.relevance_score})`
                ).join('\n') || '_no candidates_';
            } catch (e) {
              body = `## Global Discovery — ${new Date().toISOString()}\n\nRun failed: ${e.message}`;
            }
            const step = '${{ steps.discover.outcome }}';
            const failed = (step === 'failure');
            if (candidateCount > 0 || failed) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 10
              });
              const hq = issues.find(i => i.title.includes('Moltbook Agency V1'));
              if (hq) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: hq.number, body
                });
              }
            }
