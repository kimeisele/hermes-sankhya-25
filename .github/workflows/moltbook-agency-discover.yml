name: Moltbook Agency — Global Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: moltbook-agency-discover
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run global discovery
        id: discover
        run: |
          python3 scripts/moltbook_discover.py \
            --output /tmp/discovery \
            --report /tmp/discovery/discovery_report.md \
            --candidates /tmp/discovery/discovery_candidates.json
        env:
          MOLTBOOK_API_URL: https://www.moltbook.com/api/v1

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: discovery-${{ github.run_id }}
          path: |
            /tmp/discovery/discovery_candidates.json
            /tmp/discovery/discovery_report.md
          retention-days: 7

      - name: Report new candidates or failures to HQ issue
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ISSUE_NUMBER = 513;
            const MARKER_PREFIX = '<!-- hermes-global-discovery-v1:candidate-ids=';

            const sanitize = (s, max) => {
              if (typeof s !== 'string') s = '';
              s = s.replace(/[\r\n\t\0-\x08\x0b\x0c\x0e-\x1f]/g, ' ');
              s = s.replace(/[*_`[\]()#<>~|\\{}]/g, '');
              s = s.replace(/@/g, '');
              return s.slice(0, max).trim();
            };

            const step = '${{ steps.discover.outcome }}';
            const failed = (step === 'failure');

            // Build the body from the candidates artifact (always present).
            let candidateCount = 0;
            let newIds = [];
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/discovery/discovery_candidates.json', 'utf8'));
              if (data.status === 'failed') {
                body = `## Global Discovery — FAILED (${new Date().toISOString()})\n\n` +
                       `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                       `- failure_code: ${data.failure_code || 'unknown'}`;
                candidateCount = 0;
              } else {
                candidateCount = data.candidate_count || 0;
                const candidates = data.candidates || [];

                // Load previously reported candidate IDs from our own marker.
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: ISSUE_NUMBER, per_page: 100
                });
                const reported = new Set();
                for (const c of comments) {
                  const m = (c.body || '').match(new RegExp(MARKER_PREFIX.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^>]*) -->'));
                  if (m && m[1]) {
                    for (const id of m[1].split(',')) { if (id) reported.add(id); }
                  }
                }

                // Report only candidates never reported before.
                newIds = candidates
                  .filter(c => c.post_id && !reported.has(c.post_id))
                  .map(c => c.post_id);

                const newCands = candidates.filter(c => newIds.includes(c.post_id));
                if (newCands.length === 0) {
                  // No new candidates → no comment.
                  console.log('No new candidates; skipping HQ comment.');
                  return;
                }
                const uuidRe = /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/;
                const lines = newCands.map(c => {
                  const pid = uuidRe.test(c.post_id) ? c.post_id : '';
                  const title = sanitize(c.title, 160);
                  const author = sanitize(c.author_handle, 80);
                  const url = pid ? `https://www.moltbook.com/post/${pid}` : '';
                  return `- [${title || '(untitled)'}](${url}) — ${author || 'unknown'} (score ${c.relevance_score})`;
                });
                body = `## Global Discovery — ${new Date().toISOString()}\n\n` +
                       `${MARKER_PREFIX}${newIds.slice().sort().join(',')} -->\n\n` +
                       lines.join('\n');
              }
            } catch (e) {
              if (!failed) throw e;
              body = `## Global Discovery — FAILED (${new Date().toISOString()})\n\n` +
                     `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                     `- failure_code: artifact_unreadable`;
            }

            if (failed || candidateCount > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ISSUE_NUMBER, body
              });
            }
