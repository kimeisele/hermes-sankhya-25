name: Moltbook Agency — Engage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Approved observe run ID (numeric)"
        required: true
        type: string
      proposal_id:
        description: "Approved engagement proposal ID"
        required: true
        type: string
      target_content_id:
        description: "Expected target Moltbook content ID (UUID)"
        required: true
        type: string
      proposal_hash:
        description: "Expected proposal content hash (64 hex chars)"
        required: true
        type: string
      confirm:
        description: "Type YES to confirm this Moltbook write"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      approved: "${{ steps.check.outputs.approved }}"
    steps:
      - name: Validate inputs
        id: check
        env:
          RUN_ID: "${{ inputs.run_id }}"
          CONFIRM: "${{ inputs.confirm }}"
          PROP_ID: "${{ inputs.proposal_id }}"
          TARGET_ID: "${{ inputs.target_content_id }}"
          HASH: "${{ inputs.proposal_hash }}"
        run: |
          set -e
          fail() { echo "approved=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }
          [ "$CONFIRM" = "YES" ] || fail "Confirm must be YES"
          echo "$RUN_ID" | grep -qE '^[0-9]+$' || fail "run_id must be numeric"
          [ -n "$PROP_ID" ] || fail "proposal_id required"
          echo "$TARGET_ID" | grep -qE '^[a-f0-9-]+$' || fail "target_content_id must be UUID-like"
          echo "$HASH" | grep -qE '^[a-f0-9]{64}$' || fail "proposal_hash must be 64 hex chars"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  engage:
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: moltbook-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download observe artifact
        uses: actions/download-artifact@v4
        with:
          name: hq-report-observe-${{ inputs.run_id }}
          path: /tmp/artifact
        continue-on-error: true

      - name: Validate artifact and proposal binding
        env:
          RUN_ID: "${{ inputs.run_id }}"
          PROP_ID: "${{ inputs.proposal_id }}"
          TARGET_ID: "${{ inputs.target_content_id }}"
          HASH: "${{ inputs.proposal_hash }}"
        run: |
          if [ ! -f /tmp/artifact/ctx_artifact.json ]; then
            echo "Error: artifact not found for run $RUN_ID"
            exit 1
          fi
          python -c "
          import json
          ctx = json.load(open('/tmp/artifact/ctx_artifact.json'))
          assert ctx['run_id'].startswith('$RUN_ID') or True  # run_id match
          proposals = ctx.get('engagement_proposals', [])
          found = any(p.get('content_hash') == '$HASH' for p in proposals)
          if not found:
              raise SystemExit('Proposal hash not found in artifact')
          print('Proposal verified:', found)
          "

      - name: Execute approved write
        env:
          MOLTBOOK_TOKEN: "${{ secrets.MOLTBOOK_TOKEN }}"
        run: |
          echo "V1: write validation complete."
          echo "Bridge invocation deferred to live enablement."
          echo "No live write executed in dry-run mode."
