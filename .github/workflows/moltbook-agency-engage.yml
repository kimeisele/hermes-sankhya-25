name: Moltbook Agency — Engage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Approved observe run ID (numeric)"
        required: true
        type: string
      proposal_id:
        description: "Approved engagement proposal ID"
        required: true
        type: string
      target_content_id:
        description: "Expected target Moltbook content ID (UUID)"
        required: true
        type: string
      proposal_hash:
        description: "Expected proposal content hash (64 hex chars)"
        required: true
        type: string
      confirm:
        description: "Type YES to confirm this Moltbook write"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      approved: "${{ steps.check.outputs.approved }}"
    steps:
      - name: Validate inputs
        id: check
        env:
          RUN_ID: "${{ inputs.run_id }}"
          CONFIRM: "${{ inputs.confirm }}"
          PROP_ID: "${{ inputs.proposal_id }}"
          TARGET_ID: "${{ inputs.target_content_id }}"
          HASH: "${{ inputs.proposal_hash }}"
        run: |
          fail() { echo "approved=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }
          [ "$CONFIRM" = "YES" ] || fail "Confirm must be YES"
          echo "$RUN_ID" | grep -qE '^[0-9]+$' || fail "run_id must be numeric"
          [ -n "$PROP_ID" ] || fail "proposal_id required"
          echo "$TARGET_ID" | grep -qE '^[a-f0-9-]+$' || fail "target must be UUID-like"
          echo "$HASH" | grep -qE '^[a-f0-9]{64}$' || fail "hash must be 64 hex"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  engage:
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: moltbook-write
    env:
      RUN_ID: "${{ inputs.run_id }}"
      PROP_ID: "${{ inputs.proposal_id }}"
      TARGET_ID: "${{ inputs.target_content_id }}"
      HASH: "${{ inputs.proposal_hash }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: hq-report-observe-${{ inputs.run_id }}
          path: /tmp/artifact
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          repository: "${{ github.repository }}"
          run-id: "${{ inputs.run_id }}"

      - name: Validate artifact and proposal binding
        run: |
          pip install jsonschema --quiet
          SHA=$(git rev-parse HEAD)
          python -c "
          from agency.artifact import validate_artifact
          ctx = validate_artifact('/tmp/artifact/ctx_artifact.json',
              expected_run_id='$RUN_ID',
              expected_base_sha='$SHA',
              proposal_id='$PROP_ID',
              proposal_hash='$HASH',
              target_content_id='$TARGET_ID',
              must_be_approved=True,
              must_not_be_consumed=True)
          print('Artifact validated: run_id=' + ctx['run_id'][:12])
          "

      - name: Execute approved write
        env:
          MOLTBOOK_TOKEN: "${{ secrets.MOLTBOOK_TOKEN }}"
        run: |
          echo "Engagement validated and ready."
          echo "Bridge invocation deferred to live enablement."
          echo "No live write executed."
