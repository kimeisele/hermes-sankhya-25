name: Moltbook Agency — Engage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Approved run ID"
        required: true
        type: string
      engagement_proposal_id:
        description: "Approved engagement proposal ID"
        required: true
        type: string
      target_content_id:
        description: "Expected target Moltbook content ID"
        required: true
        type: string
      proposal_hash:
        description: "Expected proposal content hash (SHA-256)"
        required: true
        type: string
      confirm:
        description: "Type YES to confirm this Moltbook write"
        required: true
        type: string

# Permissions: read-only except for issues comment.
# Moltbook write environment is injected only in the engage job.
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Validate approval inputs
        id: check
        run: |
          if [ "${{ inputs.confirm }}" != "YES" ]; then
            echo "❌ Write not confirmed. Set confirm=YES to proceed."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ inputs.run_id }}" ]; then
            echo "❌ run_id is required"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ inputs.engagement_proposal_id }}" ]; then
            echo "❌ engagement_proposal_id is required"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ All approval inputs validated"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  engage:
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: moltbook-write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify MOLTBOOK_TOKEN is configured
        run: |
          if [ -z "${{ secrets.MOLTBOOK_TOKEN }}" ]; then
            echo "❌ MOLTBOOK_TOKEN not configured in moltbook-write environment"
            exit 1
          fi
          echo "✅ MOLTBOOK_TOKEN present"

      - name: Execute approved engagement
        id: engage
        env:
          MOLTBOOK_TOKEN: ${{ secrets.MOLTBOOK_TOKEN }}
        run: |
          echo "============================================"
          echo "  Agency V1 — Approved Engagement"
          echo "============================================"
          echo ""
          echo "Run ID:              ${{ inputs.run_id }}"
          echo "Proposal ID:         ${{ inputs.engagement_proposal_id }}"
          echo "Target content ID:   ${{ inputs.target_content_id }}"
          echo "Proposal hash:       ${{ inputs.proposal_hash }}"
          echo ""
          echo "⚠️  One public Moltbook write authorized."
          echo "   Transport: scripts/moltbook_write.py only."
          echo ""
          # Note: Actual bridge invocation is controlled by the engagement
          # proposal payload and the bridge executor role.
          # In V1 dry-run, this step validates but does not execute the write.
          echo "V1: Engagement validation complete (dry-run mode)."
          echo "    No live write executed."

      - name: Record engagement result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 10,
            });
            const hqIssue = issues.find(i =>
              i.title.includes('Moltbook Agency V1')
            );
            if (hqIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hqIssue.number,
                body: `## Engage — ${new Date().toISOString()}\n\n` +
                  `- Run ID: \`${{ inputs.run_id }}\`\n` +
                  `- Proposal ID: \`${{ inputs.engagement_proposal_id }}\`\n` +
                  `- Status: ${outcome}\n` +
                  `- V1 dry-run: no live write executed`,
              });
            }
