name: Moltbook Agency — Engage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Approved observe run ID (numeric)"
        required: true
        type: string
      proposal_id:
        description: "Approved engagement proposal ID"
        required: true
        type: string
      target_content_id:
        description: "Expected target Moltbook content ID (UUID)"
        required: true
        type: string
      proposal_hash:
        description: "Expected proposal content hash (64 hex chars)"
        required: true
        type: string
      confirm:
        description: "Type YES to confirm this Moltbook write"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      approved: "${{ steps.check.outputs.approved }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate inputs
        id: check
        env:
          RUN_ID: "${{ inputs.run_id }}"
          PROP_ID: "${{ inputs.proposal_id }}"
          TARGET_ID: "${{ inputs.target_content_id }}"
          HASH: "${{ inputs.proposal_hash }}"
          CONFIRM: "${{ inputs.confirm }}"
        run: |
          pip install jsonschema --quiet
          python -m agency.artifact validate-inputs "$RUN_ID" "$PROP_ID" "$TARGET_ID" "$HASH" "$CONFIRM"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  engage:
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: moltbook-write
    env:
      RUN_ID: "${{ inputs.run_id }}"
      PROP_ID: "${{ inputs.proposal_id }}"
      TARGET_ID: "${{ inputs.target_content_id }}"
      HASH: "${{ inputs.proposal_hash }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download observe artifact
        uses: actions/download-artifact@v4
        with:
          name: hq-report-observe-${{ inputs.run_id }}
          path: /tmp/artifact
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          repository: "${{ github.repository }}"
          run-id: "${{ inputs.run_id }}"

      - name: Validate artifact
        run: |
          pip install jsonschema --quiet
          SHA=$(git rev-parse HEAD)
          python -m agency.artifact validate-engagement \
            /tmp/artifact/ctx_artifact.json "$RUN_ID" "$SHA" "$PROP_ID" "$HASH" "$TARGET_ID"

      - name: Execute approved write
        env:
          MOLTBOOK_TOKEN: "${{ secrets.MOLTBOOK_TOKEN }}"
        run: |
          echo "=== Agency V1 Approved Engagement ==="
          echo "Run ID: $RUN_ID"
          echo "Proposal ID: $PROP_ID"
          echo "Target: $TARGET_ID"
          echo ""
          python -c "
          import json
          ctx = json.load(open('/tmp/artifact/ctx_artifact.json'))
          proposals = ctx.get('engagement_proposals', [])
          prop = next((p for p in proposals if p.get('proposal_id') == '$PROP_ID'), None)
          if prop:
              print('Proposal found, approval_state:', prop.get('approval_state'))
              print('Content hash:', prop.get('content_hash', '')[:16])
          "

      - name: Complete
        run: |
          echo "Engagement validated and ready for Bridge Executor invocation."
          echo "Bridge write path: scripts/moltbook_write.py"
          echo "Max one create, max one verify, no fallback."
