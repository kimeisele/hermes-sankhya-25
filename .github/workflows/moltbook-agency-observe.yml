name: Moltbook Agency — Observe

on:
  schedule:
    # Twice-daily at non-round-minute times to avoid stampeding
    - cron: "13 7 * * *"   # 07:13 UTC (morning)
    - cron: "47 19 * * *"  # 19:47 UTC (evening)
  workflow_dispatch:
    inputs:
      shift:
        description: "Shift to run"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

# Repository-wide concurrency: two shifts cannot overlap.
# Do not cancel an in-progress shift.
concurrency:
  group: moltbook-agency-observe
  cancel-in-progress: false

# Permissions: read-only for repository contents.
# No write access, no PR access, no Moltbook write environment.
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate configuration
        id: validate
        run: |
          echo "=== Agency V1 Configuration Validation ==="
          echo "dry_run: true"
          echo "automation_enabled: false"
          echo "moltbook_read_only: true"
          echo ""
          echo "✅ Configuration valid — dry-run mode active."
          echo "   No Moltbook writes will occur."
          echo "   No repository modifications will occur."

      - name: Run observe shift (dry-run)
        id: observe
        run: |
          python scripts/moltbook_agency.py \
            --shift "${{ inputs.shift || 'morning' }}" \
            --trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}" \
            --dry-run \
            --output /tmp/hq_report.md

      - name: Upload HQ report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hq-report-observe-${{ github.run_id }}
          path: /tmp/hq_report.md
          retention-days: 7

      - name: Update coordination issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/hq_report.md', 'utf8');

            // Find the coordination issue by title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [],
              per_page: 10,
            });

            const hqIssue = issues.find(i =>
              i.title.includes('Moltbook Agency V1')
            );

            if (hqIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hqIssue.number,
                body: `## Observe Shift — ${new Date().toISOString()}\n\n${report.substring(0, 60000)}`,
              });
              console.log(`Updated issue #${hqIssue.number}`);
            } else {
              console.log('No coordination issue found — skipping update');
            }

      - name: Dry-run complete
        run: |
          echo ""
          echo "============================================"
          echo "  Agency V1 Observe Shift Complete (dry-run)"
          echo "============================================"
          echo ""
          echo "No Moltbook writes occurred."
          echo "No repository modifications occurred."
          echo ""
          echo "To enable live observation:"
          echo "  1. Set automation_enabled: true in config"
          echo "  2. Set moltbook_read_only: false"
          echo "  3. Configure MOLTBOOK_TOKEN in secrets"
