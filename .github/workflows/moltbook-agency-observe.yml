name: Moltbook Agency — Observe

on:
  schedule:
    - cron: "13 7 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      shift:
        description: "Shift to run"
        required: false
        default: "morning"
        type: choice
        options: [morning, evening]
      ref:
        description: "Branch or SHA to checkout"
        required: false
        default: "main"
        type: string

concurrency:
  group: moltbook-agency-observe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHIFT: "${{ github.event.schedule == '47 19 * * *' && 'evening' || inputs.shift || 'morning' }}"
      GH_RUN_ID: "${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.ref || 'main' }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve base SHA
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load configuration
        id: config
        run: |
          python3 -c "
          import tomllib, sys
          with open('config/moltbook_agency.toml', 'rb') as f:
              cfg = tomllib.load(f)
          enabled = cfg.get('automation_enabled', False)
          # Full validation even when disabled
          assert cfg.get('moltbook_read_only') == True, 'Observe must be read-only'
          assert not cfg.get('allow_original_posts', False), 'Original posts must be disabled'
          assert cfg.get('max_active_inquiries', 1) == 1, 'Must have exactly one active inquiry'
          models = cfg.get('models', {})
          assert models.get('flash') in ('deepseek-v4-flash',), f'Invalid flash: {models.get(\"flash\")}'
          assert models.get('pro') in ('deepseek-v4-pro',), f'Invalid pro: {models.get(\"pro\")}'
          budget = cfg.get('budget', {})
          assert budget.get('max_role_calls', 0) > 0, 'max_role_calls must be positive'
          assert budget.get('max_tokens', 0) > 0, 'max_tokens must be positive'
          print(f'Config valid. automation_enabled={enabled}', file=sys.stderr)
          print(f'enabled={\"true\" if enabled else \"false\"}')
          " > /tmp/auto_enabled.txt
          cat /tmp/auto_enabled.txt >> "$GITHUB_OUTPUT"

      - name: Validate (disabled)
        if: steps.config.outputs.enabled != 'true'
        run: |
          echo "Agency observe is disabled (automation_enabled=false)."
          echo "Run completed successfully."

      - name: Run observe (enabled)
        if: steps.config.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
          MOLTBOOK_TOKEN: "${{ secrets.MOLTBOOK_TOKEN }}"
        run: |
          pip install jsonschema --quiet
          python scripts/moltbook_agency.py \
            --mode observe \
            --shift "$SHIFT" \
            --workflow-run-id "$GH_RUN_ID" \
            --trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}" \
            --output /tmp/hq_report.md \
            --ctx-output /tmp/ctx_artifact.json

      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: hq-report-observe-${{ github.run_id }}
          path: |
            /tmp/hq_report.md
            /tmp/ctx_artifact.json
          retention-days: 7

      - name: Update coordination issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/hq_report.md', 'utf8').substring(0, 60000);
            } catch {
              body = 'Observe shift completed (disabled).';
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 10
            });
            const hq = issues.find(i => i.title.includes('Moltbook Agency V1'));
            if (hq) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hq.number,
                body: `## Observe — ${new Date().toISOString()}\n\n${body}`
              });
            }
