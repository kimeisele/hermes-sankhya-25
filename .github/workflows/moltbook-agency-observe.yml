name: Moltbook Agency — Observe

on:
  schedule:
    - cron: "13 7 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      shift:
        description: "Shift to run"
        required: false
        default: "morning"
        type: choice
        options: [morning, evening]

concurrency:
  group: moltbook-agency-observe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve base SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          if [ -z "$SHA" ] || [ ${#SHA} -ne 40 ]; then
            echo "Error: cannot resolve valid base SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Run observe shift
        id: observe
        env:
          SHIFT: "${{ inputs.shift || 'morning' }}"
        run: |
          python -m pip install jsonschema --quiet
          python scripts/moltbook_agency.py \
            --mode dry-run \
            --shift "$SHIFT" \
            --trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}" \
            --output /tmp/hq_report.md

      - name: Generate structured CTX artifact
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from agency.orchestrator import AgencyOrchestrator, build_role_registry
          orch = AgencyOrchestrator(trigger='scheduled', shift='morning',
                                    role_registry=build_role_registry())
          ctx = orch.run()
          with open('/tmp/ctx_artifact.json', 'w') as f:
              json.dump(ctx.to_dict(sanitize=True), f, indent=2, default=str)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: hq-report-observe-${{ github.run_id }}
          path: |
            /tmp/hq_report.md
            /tmp/ctx_artifact.json
          retention-days: 7

      - name: Update coordination issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/hq_report.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 10
            });
            const hq = issues.find(i => i.title.includes('Moltbook Agency V1'));
            if (hq) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hq.number,
                body: `## Observe — ${new Date().toISOString()}\n\n${report.substring(0, 60000)}`
              });
            }
