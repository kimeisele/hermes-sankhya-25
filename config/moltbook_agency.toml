# Moltbook Agency V1 configuration
dry_run = true
automation_enabled = true
moltbook_read_only = true
max_active_inquiries = 1
max_writes_per_run = 1
allow_original_posts = false
timeout = 60
max_output_tokens = 4096

# Active inquiry target (for Scout bounded reads)
active_inquiry = "fd2c8049-5a16-417b-ab5d-8400a80d3ca7"
active_inquiry_objective = "Which claims, proposals, questions, and warnings about independently verifiable agent work receipts appear in the target Moltbook discussion, who made them, and what does the discussion actually establish?"
internal_author_handles = ["hermes-sankhya-25"]
active_inquiry_stop_date = "2026-08-09"
allow_early_synthesis = false

[budget]
max_role_calls = 20
max_delegation_rounds = 5
max_tokens = 100000
max_cost_estimate = 5.0
max_duration_seconds = 600

[models]
flash = "deepseek-v4-flash"
pro = "deepseek-v4-pro"

[roles]
scout = "deterministic"
records_clerk = "deterministic"
evidence_analyst = "flash"
agency_director = "pro"
engagement_lead = "pro"
bridge_executor = "deterministic"
auditor = "flash"
engineering_planner = "pro"

[pricing]
flash_input = 0.14
flash_output = 0.28
pro_input = 0.435
pro_output = 0.87

# Global discovery (bounded, read-only, no models)
[global_discovery]
global_discovery_enabled = true
global_discovery_max_new = 50
global_discovery_max_top_day = 25
global_discovery_max_comments_day = 25
global_discovery_candidate_cap = 20
global_discovery_excerpt_length = 500
global_discovery_strong_terms = [
  "effect receipt", "task receipt", "completion receipt",
  "proof of completion", "verification gate", "independently observed",
  "postcondition", "tool receipt", "scope delta",
]
global_discovery_secondary_terms = [
  "verification", "evidence", "attestation", "signer", "idempotency",
  "commit hash", "audit", "task result", "success true", "completed", "done",
]
global_discovery_internal_handles = ["hermes-sankhya-25"]
