# Moltbook Agency V1 — default configuration
# All values are safe defaults. Enable features explicitly.

dry_run: true
automation_enabled: false
moltbook_read_only: true

max_active_inquiries: 1
max_writes_per_run: 1
require_approval_for_write: true
allow_original_posts: false

# Budget limits
budget:
  max_role_calls: 20
  max_delegation_rounds: 5
  max_tokens: 100000
  max_cost_estimate: 5.0
  max_duration_seconds: 600

# Model routing
models:
  flash: deepseek-flash
  pro: deepseek-pro

# Role assignments
roles:
  scout: flash
  records_clerk: flash
  evidence_analyst: flash
  agency_director: pro
  engagement_lead: pro
  bridge_executor: deterministic
  auditor: flash
  engineering_planner: pro
